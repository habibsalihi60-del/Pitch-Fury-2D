:root{--bg:#140c1c;--fg:#f4f4f4;--card:#1a1c2c;--mut:#94b0c2;--acc:#ffcd75;--line:#333c57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
@keyframes bl{50%{filter:brightness(1.35)}}
body{background:var(--bg);color:var(--fg);font:15px/1.4 "PitchPixel",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;height:100vh;height:100dvh;min-height:0;overflow:hidden;background:#000}
#wrap{position:relative;width:min(100vw,calc(100vh*16/9));max-width:none;aspect-ratio:16/9;overflow:hidden;background:#000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#ov{position:absolute;inset:0;overflow:auto;display:flex;background:rgba(6,14,9,.8)}
#pn{margin:auto;background:var(--card);color:var(--fg);padding:12px 16px;border-radius:0;border:3px solid var(--acc);box-shadow:6px 6px 0 #000;max-width:860px;width:calc(100% - 16px)}
h1{margin:0;font-size:26px;letter-spacing:3px;color:var(--acc);text-shadow:3px 3px 0 #b13e53}h3{margin:8px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
.m{margin:2px 0;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.chip{border:2px solid var(--line);border-radius:0;padding:5px 6px;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--fg);font:inherit;font-size:12px;display:flex;align-items:center;gap:6px;text-align:left}
.chip.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.go{margin-top:10px;width:100%;padding:10px;border:0;border-radius:0;background:var(--acc);color:#111;font:700 16px "PitchPixel",monospace;text-transform:uppercase;letter-spacing:2px;box-shadow:4px 4px 0 #b13e53;cursor:pointer;animation:bl 1s steps(2) infinite}
.keys{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.7}
kbd{background:var(--line);color:var(--fg);padding:1px 6px;border-radius:5px;font:600 11px monospace}
.hint{display:none}
.st{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}.st th{color:var(--mut);text-align:left;font-weight:600;padding:3px 4px}.st td{padding:4px;border-top:2px solid var(--line);white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:13px}.kb{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 14px}.kr{display:grid;grid-template-columns:1fr 84px 84px;gap:4px;align-items:center;font-size:12px}.kr .chip{justify-content:center;padding:3px}
input[type=range]{accent-color:var(--acc)}
@keyframes fl{0%{box-shadow:inset 0 0 0 999px rgba(255,255,255,.5)}100%{box-shadow:inset 0 0 0 999px rgba(255,255,255,0)}}
#wrap.flash{animation:fl .5s ease-out}
@media(max-width:700px){.kb{grid-template-columns:1fr}}
#wrap{container-type:size}#wrap #ov{overflow:hidden}
#pn{font-size:clamp(10px,1.45cqw,21px)}
#ov,#ov *,#tc b{-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed;font-kerning:none}kbd{border-radius:0}.dot{border-radius:0}
#pn.mn{width:97cqw;max-width:none;max-height:97cqh;padding:1.1em 1.3em;box-sizing:border-box;overflow-x:hidden;overflow-y:auto}
#pn h1{font-size:2em;letter-spacing:.1em}#pn h3{font-size:max(12px,.85em);margin:.5em 0 .25em}#pn .m{font-size:max(12px,.9em);margin:.15em 0}

/* host: fixed 60 Hz simulation (same match feel on every refresh rate), 30 Hz snapshots; presses are never lost on a frame with no sim step */
const _stepOnline = step;
step = function (dt) {
    if (ON.live && ON.role === 'guest') return onApply(dt);

    while (ON.fa >= H && n < 4) { _stepOnline(H); ON.fa -= H; n++; if (n === 1) { for (const k in press) delete press[k]; for (const k in rel) delete rel[k]; } }
    if (n === 0) { for (const k in press) ON.pr[k] = 1; for (const k in rel) ON.rl[k] = 1; }

    const wk = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},33)'], { type: 'text/javascript' })));

        if (!(ON.live && ON.role === 'host')) return;

        if (G.state === 'intro') { try { introStep(.033); } catch (e) { } return; }
        if (!['play', 'kick', 'goal'].includes(G.state)) return;

    };
} catch (e) { }

}, 250);

setInterval(() => {
    if (!(ON.live && ON.role === 'guest')) return;

}, 300);
ov.addEventListener('click', e => {

/* CrazyGames: instant multiplayer, invite links and the "join friend" listener */
function onJoinCode(code) {
    if (ON.live || !code) return;
    if (!MP) mpCreate(0);
    if (G.state === 'title') titleLeave();
    onStop(); ON.msg = '';
    onConn(() => onRaw({ t: 'join', code: String(code).toUpperCase().slice(0, 4), name: onName() }), m => onlineUI(m));
}
function onBoot() {
    CG.onJoin(onJoinCode);

    if (inv) return onJoinCode(inv);

    if (!MP) mpCreate(0);

}

['touchend','pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{try{if(AC&&AC.state!=='running')AC.resume()}catch(e){}},{passive:true}));

};

<script>
/* CrazyGames bridge: SDK init, saves, ads, gameplay events. Works without the SDK too (local testing). */

 const acH=t=>{t=AC_S+t;let a=0xdeadbeef^t.length,b=0x41c6ce57^t.length;for(let i=0,c;i<t.length;i++){c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
